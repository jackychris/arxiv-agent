[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "arxiv-agent"
version = "0.1.0"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# Ruff – linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "B008",   # function-call-in-default-argument (common in FastAPI)
    "SIM117", # nested-with (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]  # logging.basicConfig must run before app imports

[tool.ruff.lint.isort]
known-first-party = [
    "api", "config", "llm", "mcp_client", "memory",
    "orchestrator", "prompts", "researcher", "runtime",
    "schemas", "tools", "utils",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy – static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
files = [
    "config.py", "llm.py", "prompts.py", "schemas.py", "utils.py",
    "orchestrator/", "researcher/", "runtime/", "memory/", "tools/",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# markers so tests can opt-in to slow network calls
markers = [
    "integration: tests that call real external APIs (deselect with -m 'not integration')",
    "slow: tests that take >5 s",
]
# show local variables in tracebacks
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
