events {}

http {
    server {
        listen 80;

        # Frontend: public
        location / {
            proxy_pass http://arxiv-agent:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Healthcheck: public
        location /healthz {
            proxy_pass http://arxiv-agent:8000;
            proxy_set_header Host $host;
        }

        # Stream: Basic Auth required
        # Browser EventSource will show a login dialog on first access.
        location /stream {
            auth_basic "arxiv-agent";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://arxiv-agent:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # SSE requires these settings
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;
        }

        # Chat API: blocked
        location /chat {
            return 403;
        }
    }
}
