services:
  arxiv-agent:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      # Persist long-term memory and run traces across container restarts
      - ./memory:/app/memory
      - ./runs:/app/runs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - arxiv-agent
    restart: unless-stopped
