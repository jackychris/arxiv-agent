services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arxiv_agent}
      POSTGRES_USER: ${POSTGRES_USER:-arxiv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arxiv} -d ${POSTGRES_DB:-arxiv_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  academic-mcp:
    build:
      context: .
      dockerfile: docker/mcp/academic/Dockerfile
    environment:
      PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY: ${PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY:-}
    expose:
      - "8765"
    ports:
      - "8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  github-mcp:
    build:
      context: .
      dockerfile: docker/mcp/github/Dockerfile
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GITHUB_TOOLS: ${GITHUB_TOOLS:-search_repositories,search_code,get_file_contents}
      GITHUB_READ_ONLY: "1"
    expose:
      - "8767"
    ports:
      - "8767:8767"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8767/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web-mcp:
    build:
      context: .
      dockerfile: docker/mcp/web/Dockerfile
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    expose:
      - "8768"
    ports:
      - "8768:8768"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8768/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  research-agent:
    build: .
    command: ["python", "-m", "researcher.server"]
    env_file:
      - .env
    environment:
      PORT_RESEARCH_AGENT: 8766
      RESEARCH_AGENT_URL: http://research-agent:8766
      ACADEMIC_MCP_URL: http://academic-mcp:8765/mcp
      GITHUB_MCP_URL: http://github-mcp:8767/mcp/
      WEB_MCP_URL: http://web-mcp:8768/mcp/
    depends_on:
      academic-mcp:
        condition: service_healthy
      github-mcp:
        condition: service_healthy
      web-mcp:
        condition: service_healthy
    expose:
      - "8766"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8766/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  app:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      ACADEMIC_MCP_HOST: academic-mcp
      GITHUB_MCP_HOST: github-mcp
      WEB_MCP_HOST: web-mcp
      RESEARCH_AGENT_HOST: research-agent
      ACADEMIC_MCP_URL: http://academic-mcp:8765/mcp
      GITHUB_MCP_URL: http://github-mcp:8767/mcp/
      WEB_MCP_URL: http://web-mcp:8768/mcp/
      RESEARCH_AGENT_URL: http://research-agent:8766
    depends_on:
      postgres:
        condition: service_healthy
      academic-mcp:
        condition: service_healthy
      github-mcp:
        condition: service_healthy
      web-mcp:
        condition: service_healthy
      research-agent:
        condition: service_healthy
    volumes:
      - ./runs:/app/runs
      - ./paper_content:/app/paper_content
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
