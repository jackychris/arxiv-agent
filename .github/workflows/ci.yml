name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy --ignore-missing-imports .

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    # Unit tests use -m "not integration" to skip live API calls.
    # Secrets are only available on push to main, not on PR from forks.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests (no network)
        env:
          DEEPSEEK_API_KEY: dummy-for-unit-tests
        run: |
          pytest -m "not integration" --tb=short -q
          code=$?; [ $code -eq 5 ] && exit 0 || exit $code

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t arxiv-agent:ci .
